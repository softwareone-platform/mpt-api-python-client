name: PR build and merge

on:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

# Pushes to the same branch supersede each other: the E2E step takes hours, and
# two of them must never run against the shared TEST environment at once. A new
# merge cancels the run still in flight for that branch, so only the newest
# commit is ever being tested. Grouped per ref so main and release/* are
# independent.
concurrency:
  group: push-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: "Checkout"
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: "Build test containers"
      run: make build

    - name: "Create environment file"
      run: env | grep -E '^MPT_' > .env
      env:
        RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
        RP_API_KEY: ${{ secrets.RP_API_KEY }}
        MPT_API_BASE_URL: ${{ secrets.MPT_API_BASE_URL }}
        MPT_API_TOKEN: ${{ secrets.MPT_API_TOKEN }}
        MPT_API_TOKEN_CLIENT: ${{ secrets.MPT_API_TOKEN_CLIENT }}
        MPT_API_TOKEN_OPERATIONS: ${{ secrets.MPT_API_TOKEN_OPERATIONS }}
        MPT_API_TOKEN_VENDOR: ${{ secrets.MPT_API_TOKEN_VENDOR }}

    - name: "Run validation & test"
      run: make check-all

    # Scan before E2E: E2E is long-running and can consume the whole job
    # timeout, which would otherwise skip the scan on every push.
    - name: "Run SonarCloud Scan"
      uses: SonarSource/sonarqube-scan-action@v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: "Run E2E test"
      continue-on-error: true
      run: make e2e args="--reportportal --rp-launch=$RP_LAUNCH --rp-api-key=$RP_API_KEY --rp-endpoint=$RP_ENDPOINT -o rp_launch_attributes=\"$RP_LAUNCH_ATTR\""
      env:
        RP_LAUNCH: mpt-api-client-e2e
        RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
        RP_API_KEY: ${{ secrets.RP_API_KEY }}
        RP_LAUNCH_ATTR: ref:${{ github.ref }} event_name:${{ github.event_name }}

    - name: "Stop containers"
      if: always()
      run: make down
